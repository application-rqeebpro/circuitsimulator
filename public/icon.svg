<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle for maskable & standard icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular circuit trace -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Circuit traces emanating from center -->
  <path d="M 256 76 L 256 140 M 256 372 L 256 436 M 76 256 L 140 256 M 372 256 L 436 256" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <path d="M 128 128 L 175 175 M 384 128 L 337 175 M 128 384 L 175 337 M 384 384 L 337 337" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Circuit Nodes (copper pads) -->
  <circle cx="256" cy="76" r="10" fill="#fbbf24"/>
  <circle cx="256" cy="436" r="10" fill="#fbbf24"/>
  <circle cx="76" cy="256" r="10" fill="#fbbf24"/>
  <circle cx="436" cy="256" r="10" fill="#fbbf24"/>
  <circle cx="128" cy="128" r="8" fill="#38bdf8"/>
  <circle cx="384" cy="128" r="8" fill="#38bdf8"/>
  <circle cx="128" cy="384" r="8" fill="#38bdf8"/>
  <circle cx="384" cy="384" r="8" fill="#38bdf8"/>

  <!-- Central Chip Package (IC) -->
  <rect x="146" y="146" width="220" height="220" rx="36" fill="#090d16" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- IC Orientation Notch -->
  <circle cx="256" cy="156" r="12" fill="#020617" stroke="#10b981" stroke-width="4"/>

  <!-- Mechatronics Gear / Core Symbol -->
  <g transform="translate(256, 256)">
    <!-- Central Lightning Zap -->
    <path d="M 6 -60 L -30 0 L 0 6 L -16 66 L 36 -2 L 4 -8 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
    <!-- Orbiting electrons / indicators -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="16 20"/>
    <circle cx="68" cy="-34" r="6" fill="#34d399"/>
    <circle cx="-68" cy="34" r="6" fill="#38bdf8"/>
  </g>

  <!-- Yemeni Mechatronics Academy Sub-branding Text -->
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="20" font-weight="bold" letter-spacing="2">مختبر الميكاترونكس اليمني</text>
</svg>
